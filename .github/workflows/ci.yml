name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: System libraries (ALSA for sound, X11 for the window)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libx11-dev libxcursor-dev libxkbcommon-dev
      # Pinned, so a new clippy's lints arrive as a deliberate bump.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --all-targets
      - name: Test
        run: cargo test --release
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CPU core against Unicorn
        run: |
          pip install "unicorn==2.1.4"
          python3 tools/cfdiff.py 4000
